name: Release

# Tag-driven release channel: push a tag `v0.1.1` and the Windows installer
# (nsis) + portable exe are built, attached to a GitHub Release, and
# downloadable — the fix for "v0.1.1 shipped nowhere".

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the Release and upload artifacts

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate the release on the same proof CI runs — a tag that doesn't pass
      # tests must not produce an installer.
      - name: Rebuild better-sqlite3 for Node ABI
        run: pnpm rebuild better-sqlite3

      - name: Lint
        run: pnpm run lint

      - name: Type Check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build (main + renderer)
        run: pnpm run build

      # electron-builder reads the `build` section of package.json
      # (nsis + portable targets) and the version for the artifact names.
      - name: Package Windows installers
        run: pnpm exec electron-builder --win --publish never

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }} # v1.2.3-beta → prerelease
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
