name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
    - uses: actions/checkout@v4

    # pnpm must be on PATH *before* setup-node runs, otherwise the
    # `cache: 'pnpm'` lookup fails ("Unable to locate executable file: pnpm").
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # Rebuild better-sqlite3 for the NODE ABI (postinstall targets Electron's).
    # Without this the DB-backed memory/graph suites silently skip on CI and
    # the gate proves nothing about the persistence layer.
    - name: Rebuild better-sqlite3 for Node ABI
      run: pnpm rebuild better-sqlite3

    - name: Lint
      run: pnpm run lint

    - name: Type Check
      run: pnpm run typecheck

    - name: Run Tests
      run: pnpm run test

    - name: Build
      run: pnpm run build

  windows-test:
    # The shipping platform: prove the suite green on Windows too (the
    # dictation hardware test is env-gated and will not hang here).
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Rebuild better-sqlite3 for Node ABI
      run: pnpm rebuild better-sqlite3

    - name: Type Check
      run: pnpm run typecheck

    - name: Run Tests
      run: pnpm run test

  e2e:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install Playwright system dependencies
      run: pnpm exec playwright install-deps chromium

    # Electron has no headless mode on CI: run under a virtual display.
    # `pnpm run test:e2e` builds first (pretest:e2e), so a broken build fails here.
    - name: Boot smoke test
      run: xvfb-run -a pnpm run test:e2e

  windows-build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build Windows
      run: pnpm run build:win

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: infinite-os-windows
        path: dist/*.exe
        retention-days: 7

  linux-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build Linux
      run: pnpm run build:linux

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: infinite-os-linux
        path: dist/*.AppImage
        retention-days: 7
