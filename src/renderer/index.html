<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- `frame-src` was missing, so `default-src` governed every frame and iframe:
         the Tabs browser, every section embed, and remote images were all
         refused, which meant the embedded browser could not load a single real
         website. A <webview> guest is a separate WebContents and is governed by
         the remote page's own policy, but plain iframes (oEmbed previews,
         YouTube/Vimeo embeds, docs sites) need this explicitly. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com blob:; worker-src 'self' blob:; font-src 'self' data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob: https: http:; frame-src 'self' data: blob: https: http:; child-src 'self' data: blob: https: http:; connect-src 'self' http://127.0.0.1:11434 http://localhost:11434 ws://127.0.0.1:8765 ws://localhost:8765 http://localhost:5173 ws://localhost:5173 https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://*.monaco-editor.com;" />
    <title>Infinite OS</title>
    <style>
      /* Pre-React boot splash: pure HTML/CSS so the Infinite mark paints the
         instant the window opens — never a blank frame before the bundle loads.

         Geometry here is a deliberate 1:1 twin of the React startup surface
         (App.tsx → BriefLoading): same 112×64 logo box, same glow inset, same
         status line, same 208×4 bar, same spacing. The hand-off is a pure
         cross-fade, so the mark never jumps and simply "wakes up" when the
         animated runners take over. */
      html, body { margin: 0; padding: 0; background: #08080b; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #08080b;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity .55s cubic-bezier(.4, 0, .2, 1);
      }
      #boot-splash.done { opacity: 0; pointer-events: none; }
      #boot-splash .glow {
        position: absolute; width: 220px; height: 120px; border-radius: 9999px;
        background: rgba(99,102,241,.14); filter: blur(48px);
        animation: boot-breathe 2.2s ease-in-out infinite;
      }
      @keyframes boot-breathe { 0%,100% { opacity: .6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
      /* Opacity only — a transform here would leave the mark mid-flight when
         React takes over and the hand-off would visibly jump. */
      #boot-splash svg { position: relative; width: 112px; height: 64px; animation: boot-fade .5s ease-out both; }
      @keyframes boot-fade { from { opacity: 0; } to { opacity: 1; } }
      /* Light travelling the loop. The static splash used to be three frozen
         strokes, so on a machine with Windows animations switched off it looked
         like a dead app. pathLength="1" lets a dash pattern travel the path
         without hard-coding its length. */
      #boot-splash .boot-runner {
        animation: boot-run 2.4s cubic-bezier(.5, 0, .5, 1) infinite;
        filter: drop-shadow(0 0 4px rgba(34, 211, 238, .9));
      }
      @keyframes boot-run { from { stroke-dashoffset: 1.18; } to { stroke-dashoffset: 0; } }
      /* A bright head leading the dash, so the motion reads as a travelling
         light rather than a sliding gap. */
      #boot-splash .boot-head { animation: boot-run 2.4s cubic-bezier(.5, 0, .5, 1) infinite; }
      #boot-splash .status {
        position: relative; margin: 28px 0 16px; height: 19px; line-height: 19px;
        font-size: 13px; font-weight: 500; letter-spacing: .01em; color: #a1a1aa;
      }
      #boot-splash .bar {
        position: relative; width: 208px; height: 4px; border-radius: 9999px;
        background: rgba(255,255,255,.06); box-shadow: 0 0 0 1px rgba(255,255,255,.04);
        overflow: hidden;
      }
      #boot-splash .bar > div {
        height: 100%; width: 40%; border-radius: 9999px;
        background: linear-gradient(90deg, #8b5cf6, #22d3ee, #ec4899);
        animation: boot-slide 1.6s ease-in-out infinite;
      }
      @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(280%); } }

      /* Brand motion on the boot splash is functional feedback — it tells you
         the app is alive while the bundle loads — so it is exempt from the two
         global motion kill switches. Without these overrides, `prefers-reduced-
         motion: reduce` collapsed the bar animation to a single 0.01ms step,
         which parked the fill at translateX(280%) i.e. completely off the right
         edge: a permanently EMPTY progress bar. The in-app motion toggle had the
         same effect via `animation: none`. Both must not reach the splash. */
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .glow { animation-name: boot-breathe !important; animation-duration: 2.2s !important; animation-iteration-count: infinite !important; }
        #boot-splash svg { animation-name: boot-fade !important; animation-duration: .5s !important; animation-iteration-count: 1 !important; animation-fill-mode: both !important; }
        #boot-splash .boot-runner, #boot-splash .boot-head { animation-name: boot-run !important; animation-duration: 2.4s !important; animation-iteration-count: infinite !important; }
        #boot-splash .bar > div { animation-name: boot-slide !important; animation-duration: 1.6s !important; animation-iteration-count: infinite !important; }
      }
      html[data-ui-motion="off"] #boot-splash .glow { animation-name: boot-breathe !important; animation-duration: 2.2s !important; animation-iteration-count: infinite !important; }
      html[data-ui-motion="off"] #boot-splash svg { animation-name: boot-fade !important; animation-duration: .5s !important; animation-iteration-count: 1 !important; animation-fill-mode: both !important; }
      html[data-ui-motion="off"] #boot-splash .boot-runner,
      html[data-ui-motion="off"] #boot-splash .boot-head { animation-name: boot-run !important; animation-duration: 2.4s !important; animation-iteration-count: infinite !important; }
      html[data-ui-motion="off"] #boot-splash .boot-runner { stroke-dasharray: 0.3 0.7; }
      html[data-ui-motion="off"] #boot-splash .bar > div { animation-name: boot-slide !important; animation-duration: 1.6s !important; animation-iteration-count: infinite !important; }
      /* The splash fade is a handoff, not decoration, so it keeps its duration
         even when UI motion is off — otherwise the two surfaces snap instead of
         cross-fading. */
      html[data-ui-motion="off"] #boot-splash { transition-duration: .55s !important; }
    </style>
  </head>
  <body class="bg-bg text-fg antialiased">
    <div id="boot-splash" aria-hidden="true">
      <div class="glow"></div>
      <svg viewBox="0 0 200 100" fill="none" aria-label="Infinite OS">
        <defs>
          <linearGradient id="boot-spectrum" x1="18" y1="16" x2="182" y2="84" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8b5cf6" />
            <stop offset=".5" stop-color="#22d3ee" />
            <stop offset="1" stop-color="#ec4899" />
          </linearGradient>
        </defs>
        <path d="M18 50C18 29 32 16 50 16c21 0 34 18 50 34s29 34 50 34c18 0 32-13 32-34s-14-34-32-34c-21 0-34 18-50 34S71 84 50 84C32 84 18 71 18 50Z" stroke="#38bdf8" stroke-width="7" opacity=".34" />
        <path d="M18 50C18 29 32 16 50 16c21 0 34 18 50 34s29 34 50 34c18 0 32-13 32-34s-14-34-32-34c-21 0-34 18-50 34S71 84 50 84C32 84 18 71 18 50Z" stroke="url(#boot-spectrum)" stroke-width="12" opacity=".28" />
        <path d="M18 50C18 29 32 16 50 16c21 0 34 18 50 34s29 34 50 34c18 0 32-13 32-34s-14-34-32-34c-21 0-34 18-50 34S71 84 50 84C32 84 18 71 18 50Z" stroke="url(#boot-spectrum)" stroke-width="7" opacity=".92" />
        <!-- Travelling light: a soft comet tail and a bright head, both driven by
             the same dash offset so they stay locked together around the loop. -->
        <path class="boot-runner" pathLength="1" d="M18 50C18 29 32 16 50 16c21 0 34 18 50 34s29 34 50 34c18 0 32-13 32-34s-14-34-32-34c-21 0-34 18-50 34S71 84 50 84C32 84 18 71 18 50Z" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.3 0.7" stroke-dashoffset="1.18" opacity=".95" />
        <path class="boot-head" pathLength="1" d="M18 50C18 29 32 16 50 16c21 0 34 18 50 34s29 34 50 34c18 0 32-13 32-34s-14-34-32-34c-21 0-34 18-50 34S71 84 50 84C32 84 18 71 18 50Z" stroke="#e0f2fe" stroke-width="7" stroke-linecap="round" stroke-dasharray="0.045 0.955" stroke-dashoffset="1.18" />
      </svg>
      <div class="status">Restoring workspace…</div>
      <div class="bar"><div></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
